name: CI

# Tests every push and pull request. Every commit on master that passes them becomes an image:
# ghcr.io/<owner>/boligmaskinen:sha-<commit>, also tagged master. Releases reuse that image
# (see release.yml).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes the older run pointless; master builds every commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  engine:
    name: Engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # The database tests create a database of their own on this server
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Google Chrome comes with the runner. The tests serve the small data pack in e2e/data-pack.
      - run: npx playwright test
      - name: Keep the report of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    name: The app with PostGIS (docker compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: boligmaskinen:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the app and PostGIS with the test data pack
        env:
          BOLIGMASKINEN_IMAGE: boligmaskinen
          BOLIGMASKINEN_TAG: ci
        run: |
          mkdir -p data
          cp -r frontend/e2e/data-pack data/data-pack
          docker compose up -d --wait --wait-timeout 180
      - name: Check that it answers
        run: |
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"database":"ok"'
          curl -fsS http://localhost:8080/api/version | grep -q '"revision":"${{ github.sha }}"'
          curl -fsS http://localhost:8080/data-pack/data/meta.json | grep -q '"aarhus"'
          curl -fsS http://localhost:8080/ | grep -q '<app-root>'
          curl -fsS http://localhost:8080/api/jobs | grep -q '"id":"data-pack"'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The whole app in a browser: a real job started from the jobs dialog, and the version from the server
      - name: End-to-end tests against the app and its backend
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          npm ci
          npx playwright test -c playwright.live.config.ts
      - name: Keep the report of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: frontend/playwright-report-live
          retention-days: 7
      - name: Show the logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  image:
    name: Container image
    needs: [engine, frontend, backend, e2e, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name and label the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=master
          # A build of master has no version; the release workflow sets it
          labels: |
            org.opencontainers.image.title=Boligmaskinen
            org.opencontainers.image.description=Self-hosted, map-first home search for Denmark
            org.opencontainers.image.version=
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
