name: Release

# A published release does not build anything. It takes the images CI built from the released commit
# (sha-<commit>, for amd64 and arm64) and gives them the release's version: the version label and
# APP_VERSION, which the backend reports at /api/version. The layers stay the same, so the release
# is exactly what was tested. The result is tagged with the version and, unless it is a pre-release,
# latest.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Version the image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Installs crane and logs it in to ghcr.io with this workflow's token
      - uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.22.1
      - name: Tag the image of the released commit
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="${IMAGE,,}"
          built="$image:sha-${GITHUB_SHA::7}"
          if ! crane digest "$built" > /dev/null; then
            echo "::error::There is no image $built. Only commits on master that passed CI have one, so release one of those."
            exit 1
          fi
          # Each architecture's image gets the version and a tag of its own (1.2.0-amd64, 1.2.0-arm64),
          # and an index puts them together under the version. Commits from before arm64 have amd64 only.
          platforms=$(crane manifest "$built" | jq -r '.manifests[]?.platform | select(.os == "linux") | [.os, .architecture, .variant // empty] | join("/")')
          manifests=()
          for platform in ${platforms:-linux/amd64}; do
            arch="${platform#linux/}"
            crane mutate "$built" --platform "$platform" \
              --label "org.opencontainers.image.version=$VERSION" \
              --env "APP_VERSION=$VERSION" \
              --tag "$image:$VERSION-${arch//\//-}"
            manifests+=(-m "$image:$VERSION-${arch//\//-}")
          done
          crane index append --tag "$image:$VERSION" "${manifests[@]}"
          tags="$VERSION"
          if [ "$PRERELEASE" != "true" ]; then
            crane tag "$image:$VERSION" latest
            tags="$tags and latest"
          fi
          echo "Tagged $image with $tags for $(echo ${platforms:-linux/amd64}), from $built" >> "$GITHUB_STEP_SUMMARY"
