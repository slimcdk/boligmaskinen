name: arm64

# The image for arm64 (a Raspberry Pi, Apple silicon) is built under QEMU, which takes a while, so
# this runs when what goes into the image changes, and by hand. It builds the image, checks its
# tools and the pipeline's packages, and starts the app with PostGIS and the test data pack. On
# master, CI's image job builds and pushes both architectures.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pipeline/pyproject.toml
      - pipeline/uv.lock
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: The image on arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the image for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: boligmaskinen:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: Check its tools and the pipeline's packages
        run: |
          run() { docker run --rm --platform linux/arm64 --entrypoint "$@"; }
          run uname boligmaskinen:arm64 -m | grep -qx aarch64
          run /app/pipeline/.venv/bin/python boligmaskinen:arm64 -I -c \
            'import boligmaskinen_pipeline.grid, boligmaskinen_pipeline.osm, boligmaskinen_pipeline.pack, boligmaskinen_pipeline.world, rasterio, osmium, scipy; print("pipeline ok")'
          run pmtiles boligmaskinen:arm64 version
          run pg_dump boligmaskinen:arm64 --version | grep -q 'PostgreSQL) 18\.'
      - name: Start it with PostGIS and the test data pack
        env:
          BOLIGMASKINEN_IMAGE: boligmaskinen
          BOLIGMASKINEN_TAG: arm64
        run: |
          docker pull mirror.gcr.io/postgis/postgis:18-3.6
          docker tag mirror.gcr.io/postgis/postgis:18-3.6 postgis/postgis:18-3.6
          mkdir -p data
          cp -r frontend/e2e/data-pack data/data-pack
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"database":"ok"'
          curl -fsS http://localhost:8080/data-pack/data/meta.json | grep -q '"aarhus"'
          curl -fsS http://localhost:8080/ | grep -q '<app-root>'
      - name: Show the logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
