# Updates of the dependencies, as pull requests that CI tests like any other. Minor and patch
# updates come together, one pull request per ecosystem and week.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/frontend", "/backend", "/packages/engine"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript as far as Angular allows (Angular 22: >=6.0 <6.1), the same in all three packages
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The types of the Node the app runs on (24, as in the image)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/.devcontainer"]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node's LTS versions are the even ones; moving to the next is done by hand
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
