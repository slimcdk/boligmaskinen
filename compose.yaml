# Boligmaskinen on your own machine: the app and its database.
#
#   docker compose up -d       then open http://localhost:8080
#
# The app keeps its data in ./data: the jobs fetch the sources there and build the data pack at
# the first start. Set POSTGRES_PASSWORD in an .env file next to this one before the first start,
# and create ./data as the user the app runs as (docs/self-hosting.md). The database is only
# reachable from the app, not from outside.
name: boligmaskinen

services:
  app:
    image: ${BOLIGMASKINEN_IMAGE:-ghcr.io/slimcdk/boligmaskinen}:${BOLIGMASKINEN_TAG:-master}
    restart: unless-stopped
    # The user that owns ./data (docs/self-hosting.md)
    user: "${BOLIGMASKINEN_UID:-1000}:${BOLIGMASKINEN_GID:-1000}"
    ports:
      - "${BOLIGMASKINEN_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://boligmaskinen:${POSTGRES_PASSWORD:-boligmaskinen}@db:5432/boligmaskinen
      # The area the data covers and its cell size (see backend/README.md)
      REGION: ${REGION:-denmark}
      GRID_CELL_METRES: ${GRID_CELL_METRES:-100}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: boligmaskinen
      POSTGRES_USER: boligmaskinen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boligmaskinen}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boligmaskinen -d boligmaskinen"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db:
