<div class="head" [class.off]="!group().enabled">
  <button mat-icon-button class="fold" (click)="fold()" [attr.aria-expanded]="!collapsed()"
          [attr.aria-label]="(collapsed() ? 'group.show' : 'group.hide') | transloco: { name: name() }">
    <mat-icon>{{ collapsed() ? 'expand_more' : 'expand_less' }}</mat-icon>
  </button>
  <div class="text">
    <input class="name" [value]="name()" (change)="rename($event)" [attr.aria-label]="'group.name' | transloco" maxlength="40">
    @if (collapsed()) {
      <div class="count">{{ (blocks().length === 1 ? 'group.one' : 'group.many') | transloco: { count: blocks().length } }}{{ group().enabled ? '' : ('group.off' | transloco) }}</div>
    }
  </div>
  <mat-slide-toggle [checked]="group().enabled" (change)="store.setGroupEnabled(group().id, $event.checked)" [aria-label]="'group.use' | transloco: { name: name() }" />
</div>
@if (!collapsed()) {
  @for (b of blocks(); track b.id) {
    <app-block-row [block]="b" [groupOff]="!group().enabled" />
  }
}
