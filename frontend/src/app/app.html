<div class="shell" [class.mobile]="mobile()" [style.--map-inset-left]="mapInset().left + 'px'" [style.--map-inset-top]="mapInset().top + 'px'">
  <div class="map-area">
    <app-map-view [inset]="mapInset()" />
    @if (!mobile() && !panelOpen() && !store.placing()) {
      <button #openButton mat-flat-button class="open-panel" (click)="openPanel()"><mat-icon>tune</mat-icon>{{ 'panel.whatMatters' | transloco }}</button>
    }
    @if (store.placing()) {
      <div class="placing-hint" role="status">
        <span>{{ 'app.placing' | transloco }}</span>
        <button mat-button (click)="store.placing.set(false)">{{ 'common.cancel' | transloco }}</button>
      </div>
    }
  </div>

  @if (mobile()) {
    <!-- On a phone: the map panel as a card at the top, and the weighting as a bottom sheet -->
    <section #mapCard class="card map-card phone" [attr.aria-label]="'app.mapCard' | transloco">
      <app-map-panel [compact]="true" />
    </section>
    <app-bottom-sheet class="sheet" [(state)]="sheet" (settledHeight)="sheetHeight.set($event)">
      <app-panel />
    </app-bottom-sheet>
  } @else {
    <!-- On a larger screen two panels float over the map, which runs under them to the window's edges -->
    <div #floating class="panels" [class.open]="panelOpen()" [inert]="!panelOpen()" tabindex="-1">
      <section class="card map-card" [attr.aria-label]="'app.mapCard' | transloco">
        <app-map-panel (closePanel)="closePanel()" />
      </section>
      <section class="card weighting-card" [attr.aria-label]="'app.weighting' | transloco">
        <app-panel />
      </section>
    </div>
  }
</div>
