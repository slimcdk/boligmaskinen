<div class="shell" [class.mobile]="mobile()" [style.--map-inset-left]="mapInset().left + 'px'">
  <div class="map-area">
    <app-map-view [inset]="mapInset()" />
    @if (!mobile() && !panelOpen() && !store.placing()) {
      <button #openButton mat-flat-button class="open-panel" (click)="openPanel()"><mat-icon>tune</mat-icon>What matters to you</button>
    }
    @if (store.placing()) {
      <div class="placing-hint" role="status">
        <span>Click or tap the map where the place is</span>
        <button mat-button (click)="store.placing.set(false)">Cancel</button>
      </div>
    }
  </div>

  @if (mobile()) {
    <!-- On a phone the panel is a bottom sheet over the map, which stays usable above it -->
    <app-bottom-sheet class="sheet" [(state)]="sheet" (settledHeight)="sheetHeight.set($event)">
      <app-panel />
    </app-bottom-sheet>
  } @else {
    <!-- On a larger screen it floats over the map, which runs under it to the window's edges -->
    <aside #floating class="floating" [class.open]="panelOpen()" [inert]="!panelOpen()" tabindex="-1" aria-label="Your weighting">
      <app-panel (closePanel)="closePanel()" />
    </aside>
  }
</div>
